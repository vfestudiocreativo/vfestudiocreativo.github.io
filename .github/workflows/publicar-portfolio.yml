name: Publicar portfolio VF Estudio Creativo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar archivos de la web
        run: |
          mkdir -p _site
          cp -a .nojekyll app.js assets contact.css contact.js contacto.html favicon.svg index.html nuestros-servicios.pdf portfolio.html servicios.html studio.css studio.js styles.css _site/
          test -f _site/index.html

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true

      - name: Publicar sitio web
        id: deployment
        uses: actions/deploy-pages@v4
